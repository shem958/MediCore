server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/medicore_db
    username: medicore_user
    password: medicore_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6380
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwtSecret: "VGhpc0lzQVNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uQW5kSXRTaG91bGRCZUxvbmdFbm91Z2hUb0JlU2VjdXJl"
  jwtExpirationMs: 86400000
